          schema:
            $ref: '#/definitions/api_internal_handler.ErrorResponse'
        "404":
          description: Secret not found
          schema:
            $ref: '#/definitions/api_internal_handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api_internal_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get secret
      tags:
      - secrets
    put:
      consumes:
      - application/json
      description: Replace ciphertext and nonce for an existing secret; the prior
        row is archived and the version counter increments. Optional `metadata` in
        the body is shallow-merged with existing server-side metadata (same validation
        as PATCH metadata). Use GET /{nameHash}/versions for history.
      parameters:
      - description: HMAC-SHA256 name hash (base64, URL-encoded)
        in: path
        name: nameHash
        required: true
        type: string
      - description: Project ID
        in: query
        name: project_id
        required: true
        type: string
      - description: Environment
        in: query
        name: environment
        required: true
        type: string
      - description: New ciphertext, nonce, and optional metadata merge
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_internal_handler.UpdateSecretRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_internal_handler.SecretResponse'
        "400":
          description: Missing params or invalid base64
          schema:
            $ref: '#/definitions/api_internal_handler.ErrorResponse'
        "404":
          description: Secret not found
          schema:
            $ref: '#/definitions/api_internal_handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api_internal_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update secret
      tags:
      - secrets
  /secrets/{nameHash}/metadata:
    patch:
      consumes:
      - application/json
      description: Shallow-merge plaintext metadata for a vault item without changing
        ciphertext, nonce, or the secret version counter. Use this when only labels,
        MIME hints, or descriptions change. Body must be a JSON object; unknown keys
        return 400. Send JSON null for a key to remove it. Total metadata size is
        capped server-side.
      parameters:
      - description: HMAC-SHA256 name hash (base64, URL-encoded)
        in: path
        name: nameHash
        required: true
        type: string
      - description: Project ID
        in: query
        name: project_id
        required: true
        type: string
      - description: Environment (development | staging | production)
        in: query
        name: environment
        required: true
        type: string
      - description: Fields to merge (partial object)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_internal_handler.SecretMetadataMergeBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_internal_handler.SecretResponse'
        "400":
          description: Empty body, invalid JSON, unknown keys, or metadata limits
            exceeded
          schema:
            $ref: '#/definitions/api_internal_handler.ErrorResponse'
        "404":
          description: Secret not found
          schema:
            $ref: '#/definitions/api_internal_handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api_internal_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Patch secret metadata
      tags:
      - secrets
  /secrets/{nameHash}/rollback:
    post:
      consumes:
      - application/json
      description: Revert a secret to a previously archived version. The current ciphertext
        is archived first, then the target version's ciphertext is restored. The version
        counter continues incrementing — it is never reset. Returns the updated secret
        after rollback.
      parameters:
      - description: HMAC-SHA256 name hash (base64, URL-encoded)
        in: path
        name: nameHash
        required: true
        type: string
      - description: Project ID
        in: query
        name: project_id
        required: true
        type: string
      - description: Environment
        in: query
        name: environment
        required: true
        type: string
      - description: Target version number
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_internal_handler.RollbackRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_internal_handler.SecretResponse'
        "400":
          description: Missing params, invalid name hash, or missing version in body
          schema:
            $ref: '#/definitions/api_internal_handler.ErrorResponse'
        "404":
          description: Secret not found, or target version not found in archive
          schema:
            $ref: '#/definitions/api_internal_handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api_internal_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Rollback secret
      tags:
      - secrets
  /secrets/{nameHash}/versions:
    get:
      description: Return the full version history for a secret. The current version
        is shown separately from the archived versions. Versions are ordered newest
        first.
      parameters:
      - description: HMAC-SHA256 name hash (base64, URL-encoded)
        in: path
        name: nameHash
        required: true
        type: string
      - description: Project ID
        in: query
        name: project_id
        required: true
        type: string
      - description: Environment
        in: query
        name: environment
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_internal_handler.VersionsResponse'
        "400":
          description: Missing params or invalid name hash
          schema:
            $ref: '#/definitions/api_internal_handler.ErrorResponse'
        "404":
          description: Secret not found
          schema:
            $ref: '#/definitions/api_internal_handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api_internal_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List secret versions
      tags:
      - secrets
  /secrets/bulk:
    post:
      consumes:
      - application/json
      description: Fetch multiple encrypted secrets in one request by providing a
        list of HMAC-SHA256 name hashes. Used by clients for manifest loading. Each
        item in the response includes optional plaintext `metadata` alongside ciphertext.
        Missing hashes are omitted from the result (no error).
      parameters:
      - description: Project, environment, and list of name hashes to fetch
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_internal_handler.BulkFetchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_internal_handler.BulkFetchResponse'
        "400":
          description: Invalid project_id or malformed base64 in name_hashes
          schema:
            $ref: '#/definitions/api_internal_handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api_internal_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Bulk fetch secrets
      tags:
      - secrets
  /tokens:
    get:
      description: List all tokens for a project. Never exposes token hash or plaintext.
      parameters:
      - description: Project ID
        in: query
        name: project_id
        required: true
        type: string
      - description: Filter by environment
        in: query
        name: environment
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      - description: Sort by field
        in: query
        name: sort_by
        type: string
      - description: Sort direction (asc/desc)
        in: query
        name: sort_dir
        type: string
      - description: Search by token name
        in: query
        name: search
        type: string
      - description: 'Filter by status: active, revoked, all'
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_internal_handler.ListTokensResponse'
      security:
      - SessionAuth: []
      summary: List service tokens
      tags:
      - tokens
    post:
      consumes:
      - application/json
      description: Generate a scoped service token. Plaintext shown once, SHA-256
        hashed before storage.
      parameters:
      - description: Token config
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_internal_handler.CreateTokenRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api_internal_handler.CreateTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api_internal_handler.ErrorResponse'
      security:
      - SessionAuth: []
      summary: Create service token
      tags:
      - tokens
  /tokens/{tokenID}:
    delete:
      description: Marks a service token as revoked. Immediate effect.
      parameters:
      - description: Token UUID
        in: path
        name: tokenID
        required: true
        type: string
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api_internal_handler.ErrorResponse'
      security:
      - SessionAuth: []
      summary: Revoke service token
      tags:
      - tokens
  /tokens/{tokenID}/destroy:
    delete:
      description: Permanently removes a service token from the database.
      parameters:
      - description: Token UUID
        in: path
        name: tokenID
        required: true
        type: string
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api_internal_handler.ErrorResponse'
      security:
      - SessionAuth: []
      summary: Delete service token
      tags:
      - tokens
  /users/public-key:
    get:
      parameters:
      - description: User email
        in: query
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_internal_handler.PublicKeyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api_internal_handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api_internal_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api_internal_handler.ErrorResponse'
      security:
      - SessionAuth: []
      summary: Lookup user public key
      tags:
      - recovery
securityDefinitions:
  BearerAuth:
    description: 'Service token: "Bearer ze_..."'
    in: header
    name: Authorization
    type: apiKey
  SessionAuth:
    in: cookie
    name: session_id
    type: apiKey
swagger: "2.0"
