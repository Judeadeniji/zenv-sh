name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"

      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w" -o bin/zenv-${{ matrix.goos }}-${{ matrix.goarch }} ./cli/cmd/zenv

      - name: Build API
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w" -o bin/zenv-api-${{ matrix.goos }}-${{ matrix.goarch }} ./api/cmd/zenv-api

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: bin/
          merge-multiple: true

      - name: Create GitHub Release
        run: gh release create ${{ github.ref_name }} bin/* --generate-notes --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish Native NPM Packages
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          
          for goos in linux darwin; do
            for goarch in amd64 arm64; do
              if [ "$goarch" = "amd64" ]; then
                cpu="x64"
              else
                cpu="arm64"
              fi
              
              PKG_NAME="@zenv-sh/cli-${goos}-${cpu}"
              PKG_DIR="npm-pkg-${goos}-${cpu}"
              
              mkdir -p $PKG_DIR/bin
              cp bin/zenv-${goos}-${goarch} $PKG_DIR/bin/zenv
              chmod +x $PKG_DIR/bin/zenv
              
              node -e "
                require('fs').writeFileSync('$PKG_DIR/package.json', JSON.stringify({
                  name: '$PKG_NAME',
                  version: '$VERSION',
                  os: ['$goos'],
                  cpu: ['$cpu'],
                  publishConfig: { access: 'public' },
                  repository: { type: 'git', url: 'git+https://github.com/Judeadeniji/zenv-sh.git' }
                }, null, 2));
              "
              
              cd $PKG_DIR
              npm publish --access public --provenance
              cd ..
            done
          done
        env:
          NPM_CONFIG_PROVENANCE: true
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish NPM CLI Wrapper
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cd npm-cli
          
          npm pkg set version="$VERSION"
          npm pkg set optionalDependencies.@zenv-sh/cli-linux-x64="$VERSION"
          npm pkg set optionalDependencies.@zenv-sh/cli-linux-arm64="$VERSION"
          npm pkg set optionalDependencies.@zenv-sh/cli-darwin-x64="$VERSION"
          npm pkg set optionalDependencies.@zenv-sh/cli-darwin-arm64="$VERSION"
          
          npm publish --access public --provenance
        env:
          NPM_CONFIG_PROVENANCE: true
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
