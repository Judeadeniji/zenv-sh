name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"

      - name: Test Amnesia
        run: go test -v -count=1 ./amnesia/...

      - name: Build API + CLI
        run: go build ./api/... ./cli/...

      - name: Test API
        run: go test -v -count=1 -p 1 ./api/...

  ts-test:
    name: TypeScript Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Check
        run: pnpm lint

      - name: Typecheck Packages
        run: pnpm typecheck

      - name: Build Packages
        run: pnpm build

      - name: Run Tests (Vitest)
        run: pnpm test

  cross-language-parity:
    name: Cross-Language Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install TS dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate test vectors from Go
        run: go run ./tests/generate_vectors.go > tests/vectors_ci.json

      - name: Verify vectors match committed file
        run: diff tests/vectors.json tests/vectors_ci.json

      - name: Run TS parity tests
        working-directory: packages/amnesia
        run: pnpm run test src/vectors.test.ts

  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: [go-test, ts-test, cross-language-parity]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"

      - name: Build API
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o bin/zenv-api-${{ matrix.goos }}-${{ matrix.goarch }} ./api/cmd/zenv-api

      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o bin/zenv-${{ matrix.goos }}-${{ matrix.goarch }} ./cli/cmd/zenv

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/
